<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>QA Automation Report</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-container">
        <div id="login-box">
            <h2>QA Automation Report</h2>
            <form onsubmit="return false;">
                <div><input type="password" id="password-input" placeholder="Enter password" autofocus></div>
                <div><button id="login-button">Login</button></div>
            </form>
            <div id="error-message">Incorrect password. Please try again.</div>
        </div>
    </div>

    <div id="dashboard-content">
        <div id="tooltip" class="tooltip"></div>
        <div id="session-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3>Test Sessions</h3>
                <div id="session-list"></div>
            </div>
        </div>
        <h1>QA Automation Report</h1>
        <div id="last-updated"></div>
        
        <!-- Archive Selector Container -->
        <div id="archive-selector-container">
            <!-- Dropdown Version -->
            <div id="dropdown-selector" class="selector-version">
                <label for="archive-dropdown">View: </label>
                <select id="archive-dropdown">
                    <option value="current">Current (Live)</option>
                </select>
            </div>
            
            <!-- Timeline Version -->
            <div id="timeline-selector" class="selector-version">
                <div class="timeline-header">
                    <button id="timeline-prev" class="timeline-nav">◀</button>
                    <span id="timeline-year">2024</span>
                    <button id="timeline-next" class="timeline-nav">▶</button>
                </div>
                <div id="timeline-months" class="timeline-months">
                    <!-- Months will be populated dynamically -->
                </div>
            </div>
        </div>
        
        <div id="loading-message">Loading dashboard data...</div>
        <div class="table-container" id="table-container" style="display: none;">
            <table id="dashboard-table">
                <thead id="table-header"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>
</html>

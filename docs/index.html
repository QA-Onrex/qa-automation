<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>QA Automation Report</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-container">
        <div id="login-box">
            <h2>QA Automation Report</h2>
            <form onsubmit="return false;">
                <div><input type="text" id="username-input" placeholder="Enter username" autofocus></div>
                <div><input type="password" id="password-input" placeholder="Enter password"></div>
                <div><button id="login-button">Login</button></div>
            </form>
            <div id="error-message">Incorrect password. Please try again.</div>
        </div>
    </div>

    <div id="dashboard-content">
        <div id="tooltip" class="tooltip"></div>
        <div id="session-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3>Test Sessions</h3>
                <div id="session-list"></div>
            </div>
        </div>
        <h1>QA Automation Report</h1>
        <div id="last-updated"></div>
        
        <div id="archive-selector-container">
            <div class="selector-group">
                <span class="selector-icon">📅</span>
                <label for="archive-dropdown">Dataset:</label>
                <select id="archive-dropdown">
                    <option value="current">Current (Live)</option>
                </select>
            </div>
            <div class="selector-group">
                <span class="selector-icon">⚙️</span>
                <label for="env-dropdown">Env:</label>
                <select id="env-dropdown">
                    <option value="all">All</option>
                    <option value="intdev">Development</option>
                    <option value="intacc">Acceptance</option>
                </select>
            </div>
        </div>
        
        <div id="loading-message">Loading dashboard data...</div>
        <div class="table-container" id="table-container" style="display: none;">
            <table id="dashboard-table">
                <thead id="table-header"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>

        <div id="timeline-section-wrapper" class="timeline-wrapper">
            <h2>Test Session Timeline (Last 5 Days)</h2>
            <div id="timeline-chart" class="timeline-chart-container">
                </div>
        </div>
        </div>
    <script type="module" src="scripts/main.js"></script>
</body>
</html>

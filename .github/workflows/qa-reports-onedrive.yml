# .github/workflows/qa-reports-onedrive.yml
name: 🚀 QA Reports - OneDrive Storage

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fetch-emails:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: pip install -r requirements.txt
      
    - name: Fetch emails and upload to OneDrive
      env:
        ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
        ZOHO_APP_PASSWORD: ${{ secrets.ZOHO_APP_PASSWORD }}
        ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
        ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
      run: python scripts/one_drive/one_drive_fetch_emails.py

  update-token:
    runs-on: ubuntu-latest
    needs: fetch-emails
    if: always()
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: pip install -r requirements.txt
      
    - name: Update GitHub token using CLI
      env:
        ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
        ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
      run: |
        echo "🔄 Refreshing OneDrive token..."
        
        # Get new refresh token
        NEW_TOKEN=$(python -c "
        import requests, os
        try:
            response = requests.post('https://login.microsoftonline.com/common/oauth2/v2.0/token', data={
                'client_id': os.getenv('ONEDRIVE_CLIENT_ID'),
                'client_secret': os.getenv('ONEDRIVE_CLIENT_SECRET'), 
                'refresh_token': os.getenv('ONEDRIVE_REFRESH_TOKEN'),
                'grant_type': 'refresh_token',
                'scope': 'https://graph.microsoft.com/Files.ReadWrite offline_access'
            })
            if response.status_code == 200:
                tokens = response.json()
                new_token = tokens.get('refresh_token')
                if new_token:
                    print(new_token)
                else:
                    # No new token, keep current one
                    print(os.getenv('ONEDRIVE_REFRESH_TOKEN'))
            else:
                print('ERROR: ' + str(response.status_code))
        except Exception as e:
            print('ERROR: ' + str(e))
        ")
        
        if [[ "$NEW_TOKEN" == ERROR* ]]; then
            echo "❌ Token refresh failed: $NEW_TOKEN"
        else
            echo "✅ Token refreshed successfully"
            echo "💾 Updating GitHub secret..."
            # Use --body flag with the token value directly
            gh secret set ONEDRIVE_REFRESH_TOKEN --body "$NEW_TOKEN"
            echo "🎉 GitHub secret updated! Token valid for another 90 days."
        fi

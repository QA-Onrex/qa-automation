# .github/workflows/qa-reports-onedrive.yml
name: 🚀 QA Reports - OneDrive Storage

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  fetch-emails:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: pip install -r requirements.txt
      
    - name: Fetch emails and upload to OneDrive
      env:
        ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
        ZOHO_APP_PASSWORD: ${{ secrets.ZOHO_APP_PASSWORD }}
        ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
        ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
      run: python scripts/one_drive/onedrive_fetch_emails.py

  process-attachments:
    runs-on: ubuntu-latest
    needs: fetch-emails
    if: success()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: pip install -r requirements.txt
      
    - name: Process OneDrive attachments
      env:
        ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
        ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
      run: python scripts/one_drive/onedrive_process_attachments.py

  parse-html:
    runs-on: ubuntu-latest
    needs: process-attachments
    if: success()
  
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: pip install -r requirements.txt
        
    - name: Parse HTML files from OneDrive
      env:
        REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
        ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
        ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
      run: python scripts/one_drive/onedrive_parse_html.py

  build-dashboard:
    runs-on: ubuntu-latest
    needs: parse-html
    if: success()
  
    permissions:
      contents: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: pip install -r requirements.txt
        
    - name: Build dashboard (reads from OneDrive directly)
      env:
        REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
        ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
        ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
      run: python scripts/one_drive/onedrive_build_dashboard.py
      
    - name: Verify dashboard files
      run: |
        echo "📁 Dashboard files:"
        ls -la docs/ || echo "docs/ directory not found"
        if [ -f "docs/index.html" ]; then
          echo "✅ index.html exists"
          echo "📄 File size: $(wc -c < docs/index.html) bytes"
        else
          echo "❌ index.html missing!"
          exit 1
        fi
        
    - name: Commit dashboard
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add docs/
        git diff --staged --quiet || git commit -m "Update dashboard [skip ci]"
        git push origin main

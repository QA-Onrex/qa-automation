# .github/workflows/qa-reports-onedrive.yml
name: 🚀 QA Reports - OneDrive Storage

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  fetch-emails:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: pip install -r requirements.txt
      
    - name: Fetch emails and upload to OneDrive
      env:
        ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
        ZOHO_APP_PASSWORD: ${{ secrets.ZOHO_APP_PASSWORD }}
        ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
        ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
      run: python scripts/one_drive/onedrive_fetch_emails.py

  process-attachments:
    runs-on: ubuntu-latest
    needs: fetch-emails
    if: success()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: pip install -r requirements.txt
      
    - name: Process OneDrive attachments
      env:
        ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
        ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
      run: python scripts/one_drive/onedrive_process_attachments.py

  parse-html:
    runs-on: ubuntu-latest
    needs: process-attachments
    if: success()
  
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0  # Fetch all history for proper rebasing
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: pip install -r requirements.txt
      
    - name: Parse HTML files from OneDrive
      env:
        REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
        ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
        ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
      run: python scripts/one_drive/onedrive_parse_html.py
      
    - name: Download updated results from OneDrive
      env:
        ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
        ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
      run: |
        python -c "
        import os, requests, json
        from urllib.parse import quote
        
        # Get access token
        def get_onedrive_access_token():
            client_id = os.getenv('ONEDRIVE_CLIENT_ID')
            client_secret = os.getenv('ONEDRIVE_CLIENT_SECRET')
            refresh_token = os.getenv('ONEDRIVE_REFRESH_TOKEN')
            
            token_url = 'https://login.microsoftonline.com/common/oauth2/v2.0/token'
            data = {
                'client_id': client_id,
                'client_secret': client_secret,
                'refresh_token': refresh_token,
                'grant_type': 'refresh_token',
                'scope': 'https://graph.microsoft.com/Files.ReadWrite offline_access'
            }
            
            response = requests.post(token_url, data=data)
            if response.status_code == 200:
                return response.json().get('access_token')
            else:
                raise Exception(f'Token refresh failed: {response.status_code}')
        
        # Download results.json from OneDrive
        access_token = get_onedrive_access_token()
        user_email = os.getenv('ONEDRIVE_USER_EMAIL')
        file_path = 'qa-automation/data/results.json'
        safe_path = quote(file_path)
        
        url = f'https://graph.microsoft.com/v1.0/users/{user_email}/drive/root:/{safe_path}:/content'
        headers = {'Authorization': f'Bearer {access_token}'}
        
        response = requests.get(url, headers=headers)
        if response.status_code == 200:
            os.makedirs('data', exist_ok=True)
            with open('data/results.json', 'wb') as f:
                f.write(response.content)
            print('✅ Downloaded updated results.json from OneDrive')
        else:
            print(f'❌ Failed to download results.json: {response.status_code}')
        "
        
    - name: Verify files before commit
      run: |
        echo "📁 Files to be committed:"
        ls -la data/ || echo "data/ directory not found"
        if [ -f "data/results.json" ]; then
          echo "✅ results.json exists"
          echo "📊 Record count: $(jq length data/results.json 2>/dev/null || echo 'Unknown')"
          echo "🔍 Sample encrypted URLs:"
          jq -r '.[] | select(.encrypted_url) | .encrypted_url | .[0:20] + \"...\"' data/results.json | head -3
        else
          echo "❌ results.json missing!"
        fi
        
    - name: Commit parsed results
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git pull origin main
        git add data/
        git diff --staged --quiet || git commit -m "Update parsed results [skip ci]"
        git push origin main
  
    - name: Upload results artifact
      uses: actions/upload-artifact@v4
      with:
        name: results-data
        path: data/results.json
        retention-days: 1

  build-dashboard:
    runs-on: ubuntu-latest
    needs: parse-html
    if: success()

    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0  # Fetch all history for proper rebasing
        
    - name: Download results artifact
      uses: actions/download-artifact@v4
      with:
        name: results-data
        path: data/
        
    - name: Verify downloaded results
      run: |
        echo "📁 Downloaded files:"
        ls -la data/ || echo "data/ directory not found"
        if [ -f "data/results.json" ]; then
          echo "✅ results.json exists"
          echo "📊 Record count: $(jq length data/results.json 2>/dev/null || echo 'Unknown')"
        else
          echo "❌ results.json missing!"
          exit 1
        fi
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: pip install -r requirements.txt
      
    - name: Build dashboard
      env:
        REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
      run: python scripts/one_drive/onedrive_build_dashboard.py
      
    - name: Verify dashboard files
      run: |
        echo "📁 Dashboard files:"
        ls -la docs/ || echo "docs/ directory not found"
        if [ -f "docs/index.html" ]; then
          echo "✅ index.html exists"
          echo "📄 File size: $(wc -c < docs/index.html) bytes"
        else
          echo "❌ index.html missing!"
          exit 1
        fi
        
    - name: Commit dashboard
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git pull origin main
        git add docs/
        git diff --staged --quiet || git commit -m "Update dashboard [skip ci]"
        git push origin main

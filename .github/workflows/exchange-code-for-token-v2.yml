# .github/workflows/exchange-code-for-token-v2.yml
name: 🔄 Exchange Code for Refresh Token (v2)

on:
  workflow_dispatch:

jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: pip install requests
      
    - name: Exchange Authorization Code
      env:
        ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
        ONEDRIVE_AUTH_CODE: ${{ secrets.ONEDRIVE_AUTH_CODE }}
      run: |
        echo "🔄 Exchanging authorization code for refresh token..."
        
        python3 -c "
        import requests
        import os
        import json
        
        client_id = os.getenv('ONEDRIVE_CLIENT_ID')
        client_secret = os.getenv('ONEDRIVE_CLIENT_SECRET')
        auth_code = os.getenv('ONEDRIVE_AUTH_CODE')
        
        if not all([client_id, client_secret, auth_code]):
            print('❌ Missing required environment variables')
            exit(1)
        
        print(f'🔧 Client ID: {client_id[:10]}...')
        print(f'🔧 Auth Code: {auth_code[:20]}...')
        
        # Use common endpoint for multi-tenant
        token_url = 'https://login.microsoftonline.com/common/oauth2/v2.0/token'
        data = {
            'client_id': client_id,
            'client_secret': client_secret,
            'code': auth_code,
            'redirect_uri': 'http://localhost:8080',
            'grant_type': 'authorization_code',
            'scope': 'https://graph.microsoft.com/Files.ReadWrite offline_access'
        }
        
        print('🔧 Making token request...')
        response = requests.post(token_url, data=data)
        
        print(f'📊 Response status: {response.status_code}')
        
        if response.status_code == 200:
            tokens = response.json()
            print('📊 Full response:')
            print(json.dumps(tokens, indent=2))
            
            refresh_token = tokens.get('refresh_token')
            access_token = tokens.get('access_token')
            
            if refresh_token:
                print('')
                print('🎉 SUCCESS! Refresh token obtained:')
                print('=' * 60)
                print(f'ONEDRIVE_REFRESH_TOKEN = {refresh_token}')
                print('=' * 60)
                print('')
                print('📝 Add this to GitHub Secrets as ONEDRIVE_REFRESH_TOKEN')
            else:
                print('❌ No refresh_token in response!')
                print('💡 This usually means:')
                print('   - Missing offline_access scope')
                print('   - App not configured for refresh tokens')
                print('   - Organizational policy blocking refresh tokens')
        else:
            print(f'❌ Failed: {response.status_code}')
            print(f'Error: {response.text}')
        "

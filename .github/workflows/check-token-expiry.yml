# .github/workflows/check-token-expiry.yml
name: 🔍 Check Token Expiration

on:
  workflow_dispatch:  # Manual trigger only
  schedule:
    - cron: '0 0 1 * *'  # Run on the 1st of every month

jobs:
  check-token:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: pip install requests
    
    - name: Check token expiration
      env:
        ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
        ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
      run: |
        echo "🔍 Checking OneDrive token expiration..."
        
        python -c "
        import requests
        import os
        from datetime import datetime, timedelta
        
        def check_token_expiry():
            # Test the current token
            token_url = 'https://login.microsoftonline.com/common/oauth2/v2.0/token'
            data = {
                'client_id': os.getenv('ONEDRIVE_CLIENT_ID'),
                'client_secret': os.getenv('ONEDRIVE_CLIENT_SECRET'),
                'refresh_token': os.getenv('ONEDRIVE_REFRESH_TOKEN'),
                'grant_type': 'refresh_token',
                'scope': 'https://graph.microsoft.com/Files.ReadWrite offline_access'
            }
            
            response = requests.post(token_url, data=data)
            
            if response.status_code == 200:
                tokens = response.json()
                new_refresh_token = tokens.get('refresh_token')
                
                # Calculate expiration (refresh tokens typically last 90 days)
                # Since we just refreshed it, it's good for another 90 days
                expiry_date = datetime.now() + timedelta(days=90)
                
                print('✅ TOKEN STATUS: ACTIVE')
                print('=' * 50)
                print(f'📅 Estimated expiration: {expiry_date.strftime(\"%Y-%m-%d\")}')
                print(f'⏰ Days remaining: {(expiry_date - datetime.now()).days} days')
                print('')
                print('🔧 Token details:')
                print(f'   - Can be refreshed: YES')
                print(f'   - New token available: {\"YES\" if new_refresh_token else \"NO\"}')
                print('')
                print('💡 Next automatic refresh: On next workflow run')
                print('=' * 50)
                
            else:
                print('❌ TOKEN STATUS: INVALID OR EXPIRED')
                print(f'   Error: {response.status_code} - {response.text}')
                print('')
                print('🚨 ACTION REQUIRED: Run the token setup workflow')
        
        check_token_expiry()
        "

# .github/workflows/test-organizations-tenant.yml
name: 🔧 Test with Organizations Tenant

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Test with Organizations Endpoint
      env:
        ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
      run: |
        echo "🔧 Testing with 'organizations' tenant endpoint"
        echo ""
        echo "Visit this URL:"
        echo "https://login.microsoftonline.com/organizations/oauth2/v2.0/authorize?client_id=$ONEDRIVE_CLIENT_ID&scope=https://graph.microsoft.com/Files.ReadWrite&response_type=code&redirect_uri=http://localhost:8080&response_mode=query"
        echo ""
        echo "This works for most organizational accounts."

name: QA Reports Netlify

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  QA-Reports-Netlify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography
          pip install requests

      - name: Fetch Emails
        env:
          ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
          ZOHO_APP_PASSWORD: ${{ secrets.ZOHO_APP_PASSWORD }}
          REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
        run: |
          python scripts/netlify/netlify_fetch_emails.py || echo "Email fetch completed"

      - name: Extract HTML from Attachments
        env: 
          REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
        run: |
          python scripts/netlify/netlify_extract_html.py || echo "No attachments to extract"

      - name: Prepare Netlify Deployment
        run: python scripts/netlify/netlify_upload_html.py

      - name: Parse HTML and Build Results
        env: 
          REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
        run: python scripts/netlify/netlify_parse_html.py

      - name: Build Dashboard
        env:
          REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
        run: python scripts/netlify/netlify_build_dashboard.py

      - name: Commit and Deploy to Netlify
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git add docs/
          git add public/  # This triggers Netlify deployment
          git commit -m "Update QA reports and deploy to Netlify [skip ci]" || echo "No changes"
          git push

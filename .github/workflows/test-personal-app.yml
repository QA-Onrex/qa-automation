# .github/workflows/test-personal-app.yml
name: 🔧 Test Personal Account App

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Test Personal Account Auth
      env:
        ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
      run: |
        echo "🔧 Testing with Personal Microsoft Account"
        echo ""
        echo "Visit this URL and sign in with ANY Microsoft account:"
        echo "https://login.microsoftonline.com/common/oauth2/v2.0/authorize?client_id=$ONEDRIVE_CLIENT_ID&scope=https://graph.microsoft.com/Files.ReadWrite&response_type=code&redirect_uri=http://localhost:8080&response_mode=query"
        echo ""
        echo "This should work with:"
        echo "- Personal accounts (Outlook.com, Hotmail.com)"
        echo "- Work/school accounts (if admin allows external apps)"

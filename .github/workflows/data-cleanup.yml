name: 🧹 Daily Data Cleanup

on:
  schedule:
    - cron: '0 11 * * *'  # Run daily at 11 AM UTC
  workflow_dispatch:  # This enables manual triggering

permissions:
  contents: write

jobs:
  data-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies (if needed)
        run: |
          pip install -r requirements.txt
          # Or install specific dependencies if needed

      - name: Run Netlify Draft Cleanup
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

        run: python scripts/cleanup_drafts.py

      - name: Run Data Cleanup
        env:
          ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
          ZOHO_APP_PASSWORD: ${{ secrets.ZOHO_APP_PASSWORD }}
        run: python scripts/cleanup_data.py

      - name: Commit Updated Data and Dashboard
        run: |
          echo "=== COMMITTING RESULTS ==="
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # Add the generated files
          git add data/
          
          git commit -m "Update results" || echo "No changes"
          git push || echo "Push failed or no changes"

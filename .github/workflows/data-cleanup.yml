name: Daily Data Cleanup

on:
  workflow_dispatch:  # This enables manual triggering

permissions:
  contents: write

jobs:
  data-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies (if needed)
        run: |
          pip install -r requirements.txt
          # Or install specific dependencies if needed

      - name: Run Netlify Draft Cleanup
        run: python scripts/netlify/netlify_cleanup_drafts.py

      - name: Run Data Cleanup
        run: python scripts/netlify/netlify_cleanup_data.py

      - name: Commit Updated Data and Dashboard
        run: |
          echo "=== COMMITTING RESULTS ==="
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # Add the generated files
          git add data/
          
          git commit -m "Update results" || echo "No changes"
          git push || echo "Push failed or no changes"
